<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Detection & Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1>Basketball Detection & Game System</h1>
        <p class="subtitle">Real-time object detection and interactive gameplay</p>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="detection">
          <i data-lucide="video"></i>
          <span>Detection</span>
        </button>
        <button class="tab-btn" data-tab="game">
          <i data-lucide="gamepad-2"></i>
          <span>Game</span>
        </button>
      </nav>
    </header>

    <main class="content">
      <div id="detection-tab" class="tab-content active">
        <section class="input-section">
          <div class="input-group">
            <div class="input-wrapper">
              <i data-lucide="link" class="input-icon"></i>
              <input type="text" id="videoUrl" placeholder="Enter YouTube video URL" />
            </div>
            <button id="loadBtn" class="btn btn-primary">
              <i data-lucide="download"></i>
              <span>Load Video</span>
            </button>
          </div>

          <div class="controls">
            <div class="control-group">
              <label class="control-label">
                <span>Confidence Threshold</span>
                <span class="control-value" id="confidenceValue">3%</span>
              </label>
              <input type="range" id="confidence" min="1" max="50" value="3" step="1" class="slider" />
              <p class="control-hint">Broadcast: 1-5% | Close-up: 20-50%</p>
            </div>

            <div class="control-group">
              <label class="control-label">
                <span>Processing Speed</span>
                <span class="control-value" id="speedValue">Medium</span>
              </label>
              <input type="range" id="speed" min="1" max="10" value="5" step="1" class="slider" />
              <p class="control-hint">Lower speed provides better accuracy</p>
            </div>

            <button id="toggleBtn" class="btn btn-secondary" disabled>
              <i data-lucide="play"></i>
              <span>Start Detection</span>
            </button>
          </div>
        </section>

        <div id="status" class="alert"></div>

        <section class="video-section">
          <div class="video-container" id="videoContainer">
            <video id="videoPlayer" controls></video>
            <canvas id="canvas"></canvas>
          </div>
        </section>

        <section class="stats" id="stats">
          <h3 class="stats-title">Detection Statistics</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon">
                <i data-lucide="image"></i>
              </div>
              <div class="stat-content">
                <div class="stat-label">Frames Processed</div>
                <div class="stat-value" id="framesProcessed">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">
                <i data-lucide="target"></i>
              </div>
              <div class="stat-content">
                <div class="stat-label">Detections</div>
                <div class="stat-value" id="detectionsCount">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">
                <i data-lucide="bar-chart-3"></i>
              </div>
              <div class="stat-content">
                <div class="stat-label">Avg Confidence</div>
                <div class="stat-value" id="avgConfidence">0%</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">
                <i data-lucide="activity"></i>
              </div>
              <div class="stat-content">
                <div class="stat-label">Processing FPS</div>
                <div class="stat-value" id="fps">0</div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="game-tab" class="tab-content">
        <iframe src="/game.html" frameborder="0" class="game-frame"></iframe>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script type="module" src="app.js"></script>
  <script type="module" src="tabs.js"></script>
</body>
</html>
